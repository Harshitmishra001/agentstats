[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentstats"
version = "0.1.0"
description = "A terminal-native observability tool for auto-instrumenting and classifying LLM agent failures."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.18.0"]
all = ["openai>=1.0.0", "anthropic>=0.18.0"]

[project.urls]
Homepage = "https://github.com/yourusername/agentstats"
